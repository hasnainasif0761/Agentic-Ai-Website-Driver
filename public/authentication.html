<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWeb Solution - Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#070B14',
                        brandCard: '#0F172A',
                        nwebCyan: '#00B4D8',
                        nwebBlue: '#0077B6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-brandDark text-slate-100 min-h-screen flex flex-col justify-between antialiased relative overflow-x-hidden selection:bg-nwebCyan selection:text-black">

    <!-- Background Glow Effects -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-nwebCyan/10 blur-[120px] rounded-full pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="w-full max-w-7xl py-4 mx-auto px-6 flex justify-between items-center relative z-10">
        <a href="index.html" class="flex items-center gap-3">
            <img src="./Screenshot 2026-09-14 154953.png" alt="NWeb Solution Logo" class="w-[200px]">
        </a>

        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-nwebCyan transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <!-- Main Auth Card Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 relative z-10">
        <div class="w-full max-w-md bg-brandCard/80 backdrop-blur-2xl border border-slate-800 p-8 rounded-3xl shadow-2xl shadow-black/50">
            
            <!-- Logo Badge & Heading -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-nwebBlue to-nwebCyan p-[2px] rounded-2xl mb-4 shadow-lg shadow-nwebCyan/20">
                    <div class="w-full h-full bg-brandDark rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-user-shield text-2xl text-nwebCyan"></i>
                    </div>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold text-white tracking-tight">Welcome Back</h2>
                <p id="auth-subtitle" class="text-xs text-slate-400 mt-1">Sign in to access NWeb Solution AI Dashboard</p>
            </div>

            <!-- Auth Mode Toggle Tabs -->
            <div class="flex bg-brandDark/80 p-1 rounded-xl border border-slate-800 mb-6 text-xs font-semibold">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg text-white bg-slate-800 shadow transition-all">
                    Login
                </button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="loginUser(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="email" id="login_email" required placeholder="id@institute.com" class="w-full bg-brandDark border border-slate-800 focus:border-nwebCyan rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="password" id="login_pass" required placeholder="••••••••" class="w-full bg-brandDark border border-slate-800 focus:border-nwebCyan rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none transition">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-800 bg-brandDark text-nwebCyan focus:ring-0">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-nwebCyan hover:underline font-medium">Forgot Password?</a>
                </div>

                <button type="submit" id="btn-login" class="w-full py-3.5 bg-gradient-to-r from-nwebBlue to-nwebCyan text-white font-bold text-sm rounded-xl shadow-lg shadow-nwebCyan/20 hover:shadow-nwebCyan/40 hover:scale-[1.01] active:scale-[0.99] transition mt-2">
                    Sign In
                </button>
            </form>

            <!-- Signup Form (Initially Hidden) -->
            <form id="form-signup" onsubmit="createUser(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="text" id="fullname" required placeholder="John Doe" class="w-full bg-brandDark border border-slate-800 focus:border-nwebCyan rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="email" id="reg_email" required placeholder="name@institute.com" class="w-full bg-brandDark border border-slate-800 focus:border-nwebCyan rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Create Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="password" id="reg_pass" required placeholder="••••••••" class="w-full bg-brandDark border border-slate-800 focus:border-nwebCyan rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none transition">
                    </div>
                </div>

                <button type="submit" id="btn-signup" class="w-full py-3.5 bg-gradient-to-r from-nwebBlue to-nwebCyan text-white font-bold text-sm rounded-xl shadow-lg shadow-nwebCyan/20 hover:shadow-nwebCyan/40 hover:scale-[1.01] active:scale-[0.99] transition mt-2">
                    Create Account
                </button>
            </form>

            <!-- Security Note Footer -->
            <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
                <p class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-nwebCyan"></i>
                    Protected by NWeb Solution Enterprise Auth System
                </p>
            </div>

        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 relative z-10">
        NWeb Solution © 2026. All rights reserved.
    </footer>

    <!-- Auth Logic Script -->
    <script>
        function switchAuthTab(mode) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                tabLogin.className = "flex-1 py-2.5 rounded-lg text-white bg-slate-800 shadow transition-all";
                tabSignup.className = "flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all";
                
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to access NWeb Solution AI Dashboard";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                
                tabSignup.className = "flex-1 py-2.5 rounded-lg text-white bg-slate-800 shadow transition-all";
                tabLogin.className = "flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white transition-all";
                
                title.innerText = "Get Started";
                subtitle.innerText = "Create an account to integrate NWeb Solution AI";
            }
        }

        // Register User Endpoint Handler
        async function createUser(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btn-signup');
            const name = document.getElementById('fullname').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_pass').value;

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Creating Account...";

                const response = await fetch('https://agentic-ai-website-driver.vercel.app//api/auth/registerUser', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }

                    alert('Registration Successful! Redirecting to Dashboard...');
                    document.getElementById('form-signup').reset();
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || 'Registration failed.');
                }
            } catch (error) {
                console.error('Error during registration:', error);
                alert('Server error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
            }
        }

        // Login User Endpoint Handler
        async function loginUser(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btn-login');
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_pass').value;

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Signing In...";

                const response = await fetch('https://agentic-ai-website-driver.vercel.app//api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.message || 'Invalid credentials.');
                }
            } catch (error) {
                console.error('Error during login:', error);
                alert('Server error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
